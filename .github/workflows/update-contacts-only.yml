name: Update Contact Details Only

on:
  workflow_dispatch:

jobs:
  update-contacts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Run update script
        run: python3 update_contacts.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git diff --staged --quiet || git commit -m "Update contact details: Instagram (@butterflybloom_cdc/), phone (+91-8019589810), email (hello@), address, hours"
          git push
